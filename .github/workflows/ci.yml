name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the CI machine has no GPU, and every test here is
          # designed to run without one.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov ruff pandas numpy scipy scikit-learn \
                      matplotlib rouge-score tqdm

      - name: Lint
        run: ruff check . --exclude venv

      - name: Test with coverage
        run: |
          pytest --cov=analysis --cov=research --cov=eval --cov=models \
                 --cov-report=term-missing -m "not gpu"
