name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the CI machine has no GPU, and every test here is
          # designed to run without one.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # transformers is imported at module scope by models/configs.py for
          # BitsAndBytesConfig, so collection fails without it. The CUDA
          # bitsandbytes wheel is NOT needed: the config object constructs
          # fine without it, and no test loads a quantized model.
          pip install transformers
          pip install pytest pytest-cov ruff pandas numpy scipy scikit-learn \
                      matplotlib rouge-score tqdm fastapi prometheus-client httpx

      - name: Lint
        run: ruff check . --exclude venv

      - name: Test with coverage
        run: |
          # The floor is enforced, not merely reported. An unchecked coverage
          # claim is the same class of defect as an unchecked accuracy claim.
          # 60% sits just below the current 64.5% so the gate catches real
          # regressions without tripping on rounding. A CPU-only suite cannot
          # honestly reach a typical 80% bar: the GPU-bound modules (loader,
          # env, perplexity, generate) never execute here. Raise the floor as
          # coverage improves; never lower it.
          pytest --cov=analysis --cov=research --cov=eval --cov=models \
                 --cov-report=term-missing --cov-fail-under=60 -m "not gpu"
